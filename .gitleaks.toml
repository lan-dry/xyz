# Exact path allowlists for known fixtures + pattern allowlists where needed.
# No directory free-pass for test/ or _raw/. Historical .env_deploy secrets are NOT allowlisted — rotate them.
title = "salanor"

[extend]
useDefault = true

[allowlist]
description = "Known fixtures (exact paths) and build noise"
paths = [
  '''conformance[/\\]vectors\.json''',
  '''sdks[/\\]conformance[/\\]vectors[/\\]aegis-src1-v1\.json''',
  '''docs[/\\]TEST_PACK[/\\]provenance[/\\]bundles[/\\]g1-exported-bundle\.json''',
  '''docs[/\\]TEST_PACK[/\\]scenarios-ag[/\\]''',
  '''tools[/\\]independent-verify[/\\]fixtures[/\\]g1-exported-bundle\.json''',
  '''tools[/\\]independent-verify[/\\]write-g1-fixture\.mjs''',
  '''services[/\\]aegis-api[/\\]scripts[/\\]write-g1-bundle-fixture\.mts''',
  '''services[/\\]insurance-api[/\\]test[/\\]platform\.integration\.test\.ts''',
  '''\.demo-tenant-emails\.local\.example\.json''',
  '''(^|[/\\])\.env\.example$''',
  '''apps[/\\]pilot-agent[/\\]\.env\.example''',
  '''examples[/\\].+[/\\]\.env\.example''',
  '''docs[/\\]AEGIS_GOVERNANCE_BRIDGE_MVP\.md''',
  '''docs[/\\]provenance[/\\]SIGNING\.md''',
  '''docs[/\\]provenance[/\\]_raw_bank_''',
  '''tools[/\\]scripts[/\\]upgrade-migrate-check\.mts''',
  '''services[/\\]aegis-api[/\\]src[/\\]demo[/\\]live-scenarios-extended\.ts''',
  '''services[/\\]aegis-api[/\\]src[/\\]crypto[/\\]kms-ed25519\.ts''',
  '''services[/\\]aegis-api[/\\]src[/\\]crypto[/\\]key-provider\.ts''',
  '''packages[/\\].+[/\\]kms-ed25519\.ts''',
  '''packages[/\\].+[/\\]key-provider\.ts''',
  '''tools[/\\]demo[/\\]connector-sources\.mts''',
  '''tools[/\\]bank-simulator[/\\]redteam-live\.mjs''',
  '''docs[/\\]provenance[/\\]INTEGRATION\.md''',
  '''(^|[/\\])node_modules([/\\]|$)''',
  '''(^|[/\\])\.next([/\\]|$)''',
  '''(^|[/\\])\.nx([/\\]|$)''',
  '''(^|[/\\])dist([/\\]|$)''',
  '''\.tools[/\\]gitleaks[/\\]''',
]
regexes = [
  '''__SET_LOCAL_PASSWORD__''',
  '''vitest-approval-pass''',
  '''ECC_NIST_EDWARDS25519''',
  '''privateKeyB64''',
  '''1234abcd-12ab-34cd-56ef''',
  '''AEGIS_SIGNING_PRIVATE_KEY''',
  '''quality-gate-encryption-key''',
  '''pilot-gate-encryption-key''',
  '''k_(los|core|pay|bureau|los_redteam)_[a-z0-9_]+''',
  '''REPLACE_WITH_[A-Z0-9_]+''',
]
