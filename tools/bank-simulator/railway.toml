# Railway service: bank-simulator  (bank-demo.salanor.com)
# Root Directory = repo root. Config path = tools/bank-simulator/railway.toml
# Full runbook: docs/DEPLOY_PRODUCTION.md (section "Bank simulator")

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/docker/Dockerfile.bank-simulator"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Run ONE instance: sessions and the offline queue are per process.
numReplicas = 1
