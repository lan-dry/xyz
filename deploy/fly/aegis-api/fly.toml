# Salanor Aegis API — production (Fly.io)
# Deploy from repo root: fly deploy --config deploy/fly/aegis-api/fly.toml

app = "salanor-aegis-api"
primary_region = "fra"

[build]
dockerfile = "../../docker/Dockerfile.backend"
[build.args]
SERVICE_FILTER = "aegis-api"
START_COMMAND = "pnpm --filter aegis-api start"
WITNESS_BUILD = "1"

[env]
NODE_ENV = "production"
AEGIS_API_PORT = "8080"
COMPLIANCE_EXPORT_DIR = "/data/compliance-exports"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

[mounts]
source = "compliance_exports"
destination = "/data"
