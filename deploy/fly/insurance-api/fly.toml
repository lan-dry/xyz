# Salanor Insurance API — production (Fly.io)
# Deploy: fly deploy --config deploy/fly/insurance-api/fly.toml

app = "salanor-insurance-api"
primary_region = "fra"

[build]
dockerfile = "../../docker/Dockerfile.backend"
[build.args]
SERVICE_FILTER = "insurance-api"
START_COMMAND = "pnpm --filter insurance-api start"
WITNESS_BUILD = "0"

[env]
NODE_ENV = "production"
INSURANCE_API_PORT = "8092"

[http_service]
internal_port = 8092
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
