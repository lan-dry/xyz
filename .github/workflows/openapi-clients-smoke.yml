name: OpenAPI clients smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "services/aegis-api/openapi/**"
      - "tools/generated-clients/**"
      - "clients/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hello stubs smoke
        run: node tools/generated-clients/smoke.mjs
        continue-on-error: true
      - name: Generate clients (best effort)
        run: node tools/generated-clients/generate.mjs
        continue-on-error: true
