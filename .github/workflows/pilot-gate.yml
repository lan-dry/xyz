name: Aegis pilot gate

on:
  pull_request:
    paths:
      - "apps/pilot-agent/**"
      - "apps/web-console/**"
      - "packages/platform-auth/**"
      - "sdks/typescript/**"
      - "services/aegis-api/**"
      - "tools/demo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pilot-gate.yml"
  push:
    branches: [main]
    paths:
      - "apps/pilot-agent/**"
      - "apps/web-console/**"
      - "packages/platform-auth/**"
      - "sdks/typescript/**"
      - "services/aegis-api/**"
      - "tools/demo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pilot-gate.yml"
  workflow_dispatch:

jobs:
  pilot-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salanor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d salanor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/salanor_test
      AEGIS_BRIDGE_MASTER_KEY: pilot-gate-encryption-key
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Run pilot release gate
        run: pnpm pilot:gate
