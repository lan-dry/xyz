# [build]
# Prefer Nixpacks defaults from service settings.
# If builds fail, set Root Directory to repo root and:
#   Build:  pnpm install && pnpm --filter aegis-api build
#   Start:  pnpm --filter aegis-api start
#   OR from services/aegis-api after monorepo install: node dist/index.js

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
