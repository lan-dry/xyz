# Railway service: aegis-witness-worker
# Root Directory = repo root. Config path = services/aegis-api/railway.witness.toml
# Same DATABASE_URL (restricted app role) as aegis-api. No HTTP port, so no healthcheck.
# Full runbook: docs/DEPLOY_PRODUCTION.md

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/docker/Dockerfile.aegis-witness"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Env: DATABASE_URL, optional WITNESS_INTERVAL_MS=60000 (plus the TSA / signing vars in the runbook)
